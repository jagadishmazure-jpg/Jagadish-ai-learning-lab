name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # weekly, to catch external links that went dead
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Tests (offline)
        run: pytest
      - name: Run every spike
        run: python scripts/run_spikes.py
      - name: Docs match code and output
        run: python scripts/doc_drift.py --check
      - name: Numpy fallback backend still runs
        run: python topics/03-jev-system1-classifier/spike.py --backend numpy
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - name: Link check (local links and anchors fail hard; external 404/410 fail)
        run: python scripts/check_links.py --external

  sbom:
    # Software bill of materials for the source tree (lockfiles and manifests), kept as a build
    # artifact on every run. Image SBOMs, where the repo ships a container, come from the image job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

  secrets:
    # gitleaks over the full git history. Known false positives (public role IDs, synthetic
    # attack fixtures) are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
